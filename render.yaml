# One-click backend deploy on Render (https://render.com/docs/blueprint-spec).
# Set MONGODB_URI, CLIENT_ORIGIN and an AI key in the Render dashboard after the first deploy.
services:
  - type: web
    name: nova-chatbot-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
